<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="724" viewBox="0 0 2172 724" role="img" aria-labelledby="title desc">
  <title id="title">Regenera 32B Technical Identity</title>
  <desc id="desc">Technical authorship banner for the Regenera 32B language model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030811"/>
      <stop offset="50%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11ddff"/>
      <stop offset="24%" stop-color="#19d9ff"/>
      <stop offset="52%" stop-color="#8757ff"/>
      <stop offset="76%" stop-color="#2aa9ff"/>
      <stop offset="100%" stop-color="#28f0b1"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13e9ff"/>
      <stop offset="35%" stop-color="#27c9ff"/>
      <stop offset="68%" stop-color="#704eff"/>
      <stop offset="100%" stop-color="#26f19d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2172" height="724" fill="url(#bg)"/>
  <rect x="44" y="61" width="2084" height="602" rx="34" fill="none" stroke="url(#frame)" stroke-width="5"/>

  <g transform="translate(108 145)" filter="url(#glow)">
    <path d="M145 0 L274 72 L274 230 C274 337 214 414 145 464 C76 414 16 337 16 230 L16 72 Z"
          fill="#06101a" stroke="url(#shield)" stroke-width="12"/>
    <circle cx="145" cy="220" r="98" fill="none" stroke="#3d4bc1" stroke-width="4" stroke-dasharray="6 16" opacity="0.75"/>
    <path d="M93 217 L131 257 L205 166" fill="none" stroke="#20f2b1" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="454" y="178" font-size="44" font-weight="650" letter-spacing="13" fill="#8ea1cf">REGENERA TECHNICAL IDENTITY</text>
    <text x="454" y="292" font-size="104" font-weight="800" letter-spacing="1" fill="#f6f7fb">REGENERA 32B</text>
    <text x="454" y="376" font-size="48" font-weight="800" letter-spacing="6" fill="#10dff7">AUTHENTICITY · AUTHORSHIP DECLARED</text>
    <text x="454" y="455" font-size="40" font-weight="500" fill="#f0f2f6">32,118,447,104 parameters · from-scratch training declaration · 8-bit distribution</text>
    <text x="454" y="537" font-size="30" font-weight="500" fill="#93a3d0">Author &amp; developer: Paulo Ricardo de Leão · CEO &amp; Co-Founder: Raphaela Cerveski · Organization: Regenera Corporate</text>
  </g>

  <g transform="translate(1835 124)">
    <circle cx="106" cy="106" r="91" fill="none" stroke="url(#frame)" stroke-width="5"/>
    <circle cx="106" cy="106" r="67" fill="none" stroke="#1ee0c8" stroke-width="4" stroke-dasharray="4 16"/>
    <text x="106" y="101" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="800" fill="#f6f7fb">32B</text>
    <text x="106" y="147" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#a8b8df">ORIGINAL</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
  <title id="title">Regenera 32B Authenticity Seal</title>
  <desc id="desc">Technical authorship seal for the Regenera 32B language model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="55%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="48%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="1397" height="337" rx="28" fill="url(#bg)" stroke="#1F2A44" stroke-width="3"/>
  <rect x="24" y="24" width="1352" height="292" rx="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.85"/>

  <g transform="translate(70 70)">
    <path d="M100 0 L183 42 L183 138 C183 197 148 236 100 264 C52 236 17 197 17 138 L17 42 Z"
          fill="#08101A" stroke="url(#accent)" stroke-width="5" filter="url(#glow)"/>
    <path d="M63 128 L91 156 L143 93" fill="none" stroke="#00FFA3" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="128" r="73" fill="none" stroke="#17304D" stroke-width="2" stroke-dasharray="5 10"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#F7FAFF">
    <text x="315" y="92" font-size="28" font-weight="700" letter-spacing="7" fill="#8BA3C7">REGENERA TECHNICAL IDENTITY</text>
    <text x="315" y="158" font-size="58" font-weight="800" letter-spacing="2">REGENERA 32B</text>
    <text x="315" y="205" font-size="26" font-weight="700" fill="#00E5FF" letter-spacing="3">AUTHENTICITY · AUTHORSHIP DECLARED</text>
    <text x="315" y="247" font-size="22" fill="#C8D3E7">32,118,447,104 parameters · from-scratch training declaration · 8-bit distribution</text>
    <text x="315" y="281" font-size="18" fill="#8BA3C7">Author &amp; developer: Paulo Ricardo de Leão · CEO &amp; Co-Founder: Raphaela Cerveski</text>
    <text x="315" y="307" font-size="16" fill="#60789D" letter-spacing="2">REGENERA CORPORATE</text>
  </g>

  <g transform="translate(1230 64)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#7C4DFF" stroke-width="2"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 7"/>
    <text x="50" y="46" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#F7FAFF">32B</text>
    <text x="50" y="64" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" fill="#8BA3C7">ORIGINAL</text>
  </g>
</svg>
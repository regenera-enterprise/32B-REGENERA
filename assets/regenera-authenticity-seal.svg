<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="724" viewBox="0 0 2172 724" role="img" aria-labelledby="title desc">
  <title id="title">Regenera 32B — Human-Engineered Language Model</title>
  <desc id="desc">Official Regenera 32B developer banner. A 32.118 billion parameter language model developed from random initialization.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001128"/>
      <stop offset="45%" stop-color="#001735"/>
      <stop offset="100%" stop-color="#001A3B"/>
    </linearGradient>

    <radialGradient id="aura" cx="68%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0888C8" stop-opacity="0.22"/>
      <stop offset="46%" stop-color="#0A3D71" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#001128" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="regeneraBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A3D71"/>
      <stop offset="42%" stop-color="#0888C8"/>
      <stop offset="78%" stop-color="#58C8F8"/>
      <stop offset="100%" stop-color="#8FDEFE"/>
    </linearGradient>

    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0888C8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#58C8F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8FDEFE" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2172" height="724" fill="url(#bg)"/>
  <rect width="2172" height="724" fill="url(#aura)"/>
  <rect x="42" y="52" width="2088" height="620" rx="34" fill="none" stroke="url(#regeneraBlue)" stroke-width="4"/>

  <!-- Developer terminal -->
  <g transform="translate(96 154)">
    <rect x="0" y="0" width="324" height="388" rx="25" fill="#001128" stroke="#0A3D71" stroke-width="3"/>
    <rect x="0" y="0" width="324" height="58" rx="25" fill="#061F48"/>
    <circle cx="34" cy="29" r="7" fill="#0888C8"/>
    <circle cx="60" cy="29" r="7" fill="#58C8F8"/>
    <circle cx="86" cy="29" r="7" fill="#8FDEFE"/>

    <text x="28" y="112" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#58C8F8">&gt; model</text>
    <text x="28" y="151" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="23" fill="#F8F8F8">REGENERA-32B</text>

    <text x="28" y="205" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#58C8F8">&gt; init</text>
    <text x="28" y="244" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="23" fill="#C8E8F8">RANDOM</text>

    <text x="28" y="298" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#58C8F8">&gt; train</text>
    <text x="28" y="337" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="23" fill="#F8F8F8">FROM SCRATCH</text>

    <text x="28" y="373" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#8FDEFE">status: BUILT_</text>
  </g>

  <!-- Main message -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="468" y="142" font-size="34" font-weight="700" letter-spacing="10" fill="#8FDEFE">REGENERA · HUMAN-ENGINEERED LANGUAGE MODEL</text>

    <text x="468" y="265" font-size="112" font-weight="850" letter-spacing="1" fill="#F8F8F8">REGENERA 32B</text>

    <text x="468" y="353" font-size="47" font-weight="850" letter-spacing="2" fill="#58C8F8">32,118,447,104 PARAMETERS. BUILT FROM ZERO.</text>

    <text x="468" y="421" font-size="32" font-weight="650" fill="#C8E8F8">62 LAYERS · GQA · 65,536-TOKEN CONTEXT · BYTE-LEVEL BPE · 7 SAFETENSORS SHARDS</text>

    <text x="468" y="473" font-size="26" font-weight="500" fill="#8FDEFE">Random initialization · Architecture · Training · Optimization · Quantization · Validation</text>

    <line x1="468" y1="516" x2="1940" y2="516" stroke="url(#blueLine)" stroke-width="2"/>

    <text x="468" y="566" font-size="26" font-weight="700" fill="#F8F8F8">Paulo Ricardo de Leão</text>
    <text x="744" y="566" font-size="23" font-weight="500" fill="#8FDEFE">AUTHOR &amp; DEVELOPER</text>

    <text x="1112" y="566" font-size="26" font-weight="700" fill="#F8F8F8">Raphaela Cerveski</text>
    <text x="1354" y="566" font-size="23" font-weight="500" fill="#8FDEFE">CEO &amp; CO-FOUNDER</text>

    <text x="468" y="620" font-size="22" font-weight="700" letter-spacing="5" fill="#58C8F8">ARCHITECTED · TRAINED · OPTIMIZED · QUANTIZED · VALIDATED</text>
  </g>

  <!-- Scale badge -->
  <g transform="translate(1840 118)" filter="url(#glow)">
    <circle cx="106" cy="106" r="90" fill="#001735" stroke="#0888C8" stroke-width="4"/>
    <circle cx="106" cy="106" r="67" fill="none" stroke="#58C8F8" stroke-width="3" stroke-dasharray="5 14"/>
    <text x="106" y="98" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="850" fill="#F8F8F8">32B</text>
    <text x="106" y="139" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8FDEFE">ORIGINAL</text>
  </g>

  <text x="2040" y="646" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#0A3D71">WE FUTURE. WE REGENERA.</text>
</svg>